name = "clair-chen"
compatibility_date = "2026-09-15"
main = "worker.js"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Chat backend (AWS, see aws/README.md). AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
# CHAT_FUNCTION_URL and AGENT_RUNTIME_ARN are Worker secrets: `npx wrangler secret put <NAME>`.
# CHAT_BACKEND: "agentcore" = the agent on AgentCore Runtime; "lambda" = the older single Lambda
# (fallback: set it back and redeploy). /api/warm always uses the Lambda.
[vars]
CHAT_BACKEND = "agentcore"
AWS_REGION = "us-east-1"

# Per-visitor limits (by IP): 6 questions and 3 wake-ups per minute.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "WARM_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }
