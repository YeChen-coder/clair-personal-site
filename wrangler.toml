name = "clair-chen"
compatibility_date = "2026-09-15"
main = "worker.js"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Chat backend (AWS Lambda, see CloudAIAgentDemo). AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY are Worker secrets: `npx wrangler secret put <NAME>`.
[vars]
CHAT_FUNCTION_URL = "https://oxech4jzfhwrkpdvl3gz5nwdna0jhbul.lambda-url.us-east-1.on.aws/"
AWS_REGION = "us-east-1"

# Per-visitor limits (by IP): 6 questions and 3 wake-ups per minute.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "WARM_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }
